<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>David Han · travel</title>
  <meta name="description" content="Where David Han has been and where he's going. Click a pin.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23161615'/%3E%3Ctext x='16' y='21' font-family='monospace' font-size='12' fill='%23FAF9F5' text-anchor='middle'%3EDH%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="nav" aria-label="Site">
    <a class="nav-brand" href="index.html">DH</a>
    <div class="nav-links">
      <a href="index.html">← BACK TO EVERYTHING</a>
    </div>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">DARK</button>
  </nav>

  <main class="sec travel-page" id="main">
    <header class="sec-head">
      <p class="marker mono">// TRAVEL</p>
      <h1>Been / going</h1>
    </header>

    <div class="map-layout">
      <div class="map-canvas-wrap">
        <div id="travel-map" aria-label="Interactive travel map"></div>
        <div class="map-legend mono">
          <span><i class="pin-demo been"></i> BEEN</span>
          <span><i class="pin-demo planned"></i> PLANNED</span>
        </div>
      </div>
      <aside class="map-panel" id="map-panel">
        <p class="mono map-panel-hint">// CLICK A PIN</p>
      </aside>
    </div>

    <div class="suggest">
      <p class="mono suggest-head">// KNOW A PLACE I SHOULD GO?</p>
      <form id="suggest-form" novalidate>
        <input type="text" name="place" placeholder="The place" required aria-label="Place">
        <input type="text" name="suggestion" placeholder="What should I do there?" required aria-label="Suggestion">
        <input type="text" name="from" placeholder="Your name / contact (optional)" aria-label="Your name or contact">
        <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button type="submit" class="mono">SEND →</button>
      </form>
      <p class="mono form-msg" id="form-msg" role="status"></p>
      <p class="footnote mono">Suggestions come to me directly. They're not posted publicly.</p>
    </div>

    <div class="int-block travel-nature">
      <h3>Nature</h3>
      <p class="body-copy narrow">Shot wherever I am. Each one is pinned to its place on the map above.</p>
      <div class="nature-grid" id="nature-grid"></div>
    </div>

    <p class="mono article-back"><a href="index.html">← BACK TO EVERYTHING</a></p>
  </main>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close mono" id="lightbox-close" aria-label="Close">ESC / CLOSE ×</button>
    <div class="lightbox-body" id="lightbox-body"></div>
    <p class="lightbox-cap mono" id="lightbox-cap"></p>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="content.js"></script>
  <script src="assets/manifest.js"></script>
  <script src="travel.js"></script>
</body>
</html>
